services:
  postgres:
    image: postgres:16-alpine
    container_name: nodebe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nodebe
    ports:
      - "5432:5432"
    volumes:
      - nodebe-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nodebe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nodebe-postgres-data: